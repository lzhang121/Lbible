<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日语经文分析</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <main class="layout">
      <p id="statusText" style="display:none"></p>

      <section class="card" id="sourceSection">
        <p id="sourceText" class="source-text">-</p>
      </section>

      <section class="card" id="translationSection">
        <h2>翻译</h2>
        <p id="translationText">-</p>
      </section>

      <section class="card" id="grammarSection">
        <h2>短语</h2>
        <ul id="grammarList" class="grammar-list"></ul>
      </section>

      <section class="card" id="verbSection">
        <h2>动词</h2>
        <div id="verbList" class="token-list"></div>
      </section>

      <section class="card" id="tokenSection">
        <h2>名词</h2>
        <div id="tokenList" class="token-list"></div>
      </section>

      <section class="card warning" id="warningCard" hidden>
        <h2>提示</h2>
        <p id="warningText"></p>
      </section>
    </main>

    <script src="./vendor/tiny_segmenter.js"></script>
    <script src="./vendor/kuromoji.js"></script>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
