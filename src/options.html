<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verse Parse 设置</title>
    <link rel="stylesheet" href="vp-theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="page-head">
        <img src="icons/icon48.png" width="40" height="40" alt="" />
        <div>
          <h1>Verse Parse 设置</h1>
          <p class="subtitle" style="margin:0">Gemini → Groq → OpenRouter 依次尝试，全部失败则回退本地引擎。</p>
        </div>
      </div>

      <p class="pipeline-badge">当前链路：<span>Gemini</span> → <span>Groq</span> → <span>OpenRouter</span> → 本地</p>

      <div class="card">
        <div class="row">
          <div>
            <label for="geminiEnabled" style="margin:0">启用 Gemini 分析</label>
            <p class="hint" style="margin:4px 0 0">使用 Google AI Studio 免费层（gemini-2.0-flash）</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="geminiEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <label for="geminiApiKey">Gemini API Key</label>
        <input type="password" id="geminiApiKey" autocomplete="off" placeholder="AIza..." />
        <p class="hint">
          在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 申请，仅保存在本机。
          选中的日文会发送到 Google 服务器进行分析。
        </p>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <label for="groqEnabled" style="margin:0">启用 Groq 备用</label>
            <p class="hint" style="margin:4px 0 0">Gemini 失败时第二顺位（llama-3.3-70b）</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="groqEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <label for="groqApiKey">Groq API Key（备用）</label>
        <input type="password" id="groqApiKey" autocomplete="off" placeholder="gsk_..." />
        <p class="hint">
          在 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq Console</a> 申请免费 Key。
        </p>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <label for="openrouterEnabled" style="margin:0">启用 OpenRouter 备用</label>
            <p class="hint" style="margin:4px 0 0">第三顺位，可与前两档同时开启</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="openrouterEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <label for="openrouterApiKey">OpenRouter API Key（第三备用）</label>
        <input type="password" id="openrouterApiKey" autocomplete="off" placeholder="sk-or-..." />
        <p class="hint">
          在 <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a> 申请免费 Key。
        </p>
      </div>

      <button type="button" id="saveBtn">保存设置</button>
      <p id="status"></p>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
